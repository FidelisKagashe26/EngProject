name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -euo pipefail

            echo "🚀 Starting deployment..."

            cd /var/www/engicost

            # HARD SYNC (avoid git conflicts like .env issues)
            git fetch origin main
            git reset --hard origin/main

            echo "📦 Backend build..."
            cd Backend
            npm ci
            npm run build

            echo "♻️ Restarting backend..."
            pm2 restart engicost-backend --update-env

            echo "🌐 Frontend build..."
            cd ../Frontend
            npm ci
            VITE_API_BASE_URL=https://www.dreggam.com/api npm run build

            echo "✅ Deployment successful"
