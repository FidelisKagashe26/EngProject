name: Reset Production Data

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type CONFIRM_RESET_PRODUCTION_DATA to wipe production data"
        required: true
      admin_email:
        description: "Admin email to create after reset"
        required: true

jobs:
  reset-production-data:
    if: ${{ github.event.inputs.confirm == 'CONFIRM_RESET_PRODUCTION_DATA' }}
    runs-on: ubuntu-latest

    steps:
      - name: Reset production data via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          RESET_ADMIN_EMAIL: ${{ github.event.inputs.admin_email }}
          RESET_ADMIN_PASSWORD: ${{ secrets.RESET_ADMIN_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: RESET_ADMIN_EMAIL,RESET_ADMIN_PASSWORD
          script: |
            set -euo pipefail

            if [ -z "${RESET_ADMIN_PASSWORD:-}" ]; then
              echo "RESET_ADMIN_PASSWORD GitHub secret is required."
              exit 1
            fi

            echo "Resetting production data..."

            cd /var/www/engicost
            git fetch origin main
            git reset --hard origin/main

            cd Backend
            npm ci
            npm run build

            RESET_PRODUCTION_DATA=CONFIRM_RESET_PRODUCTION_DATA \
            RESET_ADMIN_EMAIL="$RESET_ADMIN_EMAIL" \
            RESET_ADMIN_PASSWORD="$RESET_ADMIN_PASSWORD" \
            node dist/scripts/resetProductionData.js

            pm2 restart engicost-backend --update-env

            echo "Production data reset complete."
