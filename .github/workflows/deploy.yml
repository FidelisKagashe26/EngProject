name: Deploy to Server

on:
  push:
    branches:
      - main
  # Lets the recovery + deploy be triggered by hand from the Actions tab,
  # which is the only way in when nobody can reach the hosting panel.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ── 0. Can the outside world actually reach the site? ────────────────
      # This runs on the GitHub runner, not over SSH, so it is a genuinely
      # independent vantage point. The server reporting itself healthy proves
      # nothing about reachability — it can curl itself over its own public IP
      # and never put a packet on the wire. Only a third party can tell us
      # whether the site is down for everyone or just for one network.
      - name: Reach the site from outside
        continue-on-error: true
        run: |
          IP="$(getent ahostsv4 dreggam.com | awk '{print $1}' | head -1)"
          echo "dreggam.com resolves to: ${IP:-lookup failed}"

          for port in 80 443; do
            if timeout 12 bash -c "cat < /dev/null > /dev/tcp/dreggam.com/$port" 2>/dev/null; then
              echo "tcp/$port : OPEN from GitHub's network"
            else
              echo "tcp/$port : BLOCKED or closed from GitHub's network"
            fi
          done

          echo "--- HTTPS ---"
          curl -sS -o /dev/null --max-time 20 \
            -w "https://dreggam.com/ -> %{http_code} (connect %{time_connect}s)\n" \
            https://dreggam.com/ || echo "https://dreggam.com/ FAILED from GitHub's network"
          curl -sS -o /dev/null --max-time 20 \
            -w "https://www.dreggam.com/ -> %{http_code}\n" \
            https://www.dreggam.com/ || echo "https://www.dreggam.com/ FAILED from GitHub's network"

          echo "--- verdict ---"
          echo "If the ports show OPEN here but your browser times out, the site is up"
          echo "and the block is on your side (ISP / router / DNS cache)."
          echo "If they show BLOCKED here too, the block is upstream of the VPS."

      # ── 1. Recover the box before touching it ────────────────────────────
      # Runs first and is not allowed to fail the job: if the server is unwell,
      # the build below would only make it worse, and we still want the report.
      - name: Diagnose and recover server
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 15m
          script: |
            # No `set -e` here on purpose: every command below is best-effort,
            # and one failing check must not stop the recovery that follows it.
            SUDO=""
            if [ "$(id -u)" -ne 0 ]; then
              if sudo -n true 2>/dev/null; then
                SUDO="sudo -n"
              else
                echo "WARNING: not root and no passwordless sudo — service fixes may be skipped."
              fi
            fi

            echo "===== BEFORE ====="
            df -h / 2>/dev/null
            echo "--- memory ---"
            free -h 2>/dev/null
            echo "--- swap ---"
            swapon --show 2>/dev/null || echo "no swap configured"
            echo "--- listening ports ---"
            (ss -lntp 2>/dev/null || netstat -lntp 2>/dev/null) | grep -E ':(80|443|5050)\b' || echo "nothing listening on 80/443/5050"
            echo "--- was anything OOM-killed? ---"
            (dmesg 2>/dev/null | grep -i -m 5 "out of memory") || echo "no OOM messages visible"

            echo "===== FREEING DISK ====="
            # npm's cache is the usual culprit: every deploy runs npm ci twice.
            npm cache clean --force 2>/dev/null || true
            $SUDO journalctl --vacuum-size=100M 2>/dev/null || true
            $SUDO apt-get clean 2>/dev/null || true
            pm2 flush 2>/dev/null || true
            df -h / 2>/dev/null

            echo "===== NGINX ====="
            # Validate the config first — restarting a box with a broken config
            # just fails again, and the reason belongs in this log.
            $SUDO nginx -t 2>&1 || echo "nginx config test FAILED (see above)"
            $SUDO systemctl enable nginx 2>/dev/null || true
            $SUDO systemctl restart nginx 2>&1 || $SUDO systemctl start nginx 2>&1 || echo "could not start nginx"
            $SUDO systemctl is-active nginx 2>/dev/null || echo "nginx is NOT active"

            echo "===== BACKEND (pm2) ====="
            pm2 status 2>/dev/null || echo "pm2 not reachable for this user"
            # Bring it back if the process list is empty after a reboot/OOM.
            if ! pm2 describe engicost-backend >/dev/null 2>&1; then
              echo "engicost-backend missing from pm2 — attempting resurrect"
              pm2 resurrect 2>/dev/null || true
            fi
            pm2 start engicost-backend 2>/dev/null || pm2 restart engicost-backend 2>/dev/null || true
            pm2 save 2>/dev/null || true

            echo "===== AFTER ====="
            (ss -lntp 2>/dev/null || netstat -lntp 2>/dev/null) | grep -E ':(80|443|5050)\b' || echo "STILL nothing listening on 80/443/5050"
            echo "--- local HTTP check ---"
            curl -sS -o /dev/null -w "http://127.0.0.1/ -> %{http_code}\n" --max-time 10 http://127.0.0.1/ || echo "local HTTP request failed"

            # ── Network identity ────────────────────────────────────────────
            # nginx can be listening and healthy while the outside world still
            # cannot reach it. Only two things explain that: the domain resolves
            # to a different machine, or a firewall in front of this one. These
            # checks tell the two apart.
            echo "===== IS THIS THE MACHINE THE DOMAIN POINTS AT? ====="
            MYIP="$(curl -s --max-time 10 https://api.ipify.org 2>/dev/null || curl -s --max-time 10 https://ifconfig.me 2>/dev/null)"
            echo "this server's public IP : ${MYIP:-could not determine}"
            DNSIP="$(getent ahostsv4 dreggam.com 2>/dev/null | awk '{print $1}' | head -1)"
            echo "dreggam.com resolves to : ${DNSIP:-lookup failed}"
            if [ -n "$MYIP" ] && [ -n "$DNSIP" ]; then
              if [ "$MYIP" = "$DNSIP" ]; then
                echo "MATCH — the domain points here, so the block is a firewall."
              else
                echo "MISMATCH — dreggam.com points at another machine. Deploys land here but visitors do not."
              fi
            fi

            echo "===== FIREWALL ====="
            $SUDO ufw status verbose 2>/dev/null || echo "ufw not present"
            $SUDO nft list ruleset 2>/dev/null | head -40 || echo "nftables not present"
            $SUDO iptables -S 2>/dev/null | head -40 || echo "iptables not readable"

            echo "===== NGINX SERVER BLOCKS ====="
            $SUDO nginx -T 2>/dev/null | grep -E "^\s*(server_name|listen|ssl_certificate )" | head -30 || echo "could not read nginx config"

            echo "===== CAN THIS BOX REACH ITSELF OVER THE PUBLIC PATH? ====="
            curl -sS -o /dev/null -w "https://dreggam.com/ -> %{http_code}\n" --max-time 15 https://dreggam.com/ || echo "public-path request FAILED from the server itself"
            if [ -n "$MYIP" ]; then
              curl -sS -k -o /dev/null -w "https://$MYIP/ (direct) -> %{http_code}\n" --max-time 15 "https://$MYIP/" || echo "direct-IP request FAILED"
            fi

      # ── 2. Deploy ───────────────────────────────────────────────────────
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 25m
          script: |
            set -euo pipefail

            echo "Starting deployment..."

            cd /var/www/engicost

            # HARD SYNC (avoid git conflicts like .env issues)
            git fetch origin main
            git reset --hard origin/main

            echo "Backend build..."
            cd Backend
            npm ci --no-audit --no-fund
            npm run build

            # TEMPORARY production wipe command kept for future use.
            # Uncomment this block only when you intentionally want to clear live data.
            # if [ ! -f ../.production-data-reset-complete ]; then
            #   echo "Resetting production data one time..."
            #   RESET_PRODUCTION_DATA=CONFIRM_RESET_PRODUCTION_DATA node dist/scripts/resetProductionData.js
            #   touch ../.production-data-reset-complete
            # else
            #   echo "Production data reset already completed. Skipping."
            # fi

            echo "Restarting backend..."
            pm2 restart engicost-backend --update-env
            pm2 save || true

            echo "Frontend build..."
            cd ../Frontend
            npm ci --no-audit --no-fund
            # Vite needs headroom; without a cap it can be OOM-killed on a small
            # VPS, and the kernel often takes nginx down with it.
            NODE_OPTIONS=--max-old-space-size=1024 \
              VITE_API_BASE_URL=https://www.dreggam.com/api npm run build

            echo "Deployment successful"

      # ── 3. Leave the site serving, whatever happened above ──────────────
      - name: Verify and restore services
        if: always()
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 10m
          script: |
            SUDO=""
            if [ "$(id -u)" -ne 0 ] && sudo -n true 2>/dev/null; then SUDO="sudo -n"; fi

            # A failed build must never leave the site down: the previous
            # frontend bundle is still on disk and nginx can keep serving it.
            $SUDO systemctl is-active nginx >/dev/null 2>&1 || $SUDO systemctl start nginx 2>&1 || true
            pm2 describe engicost-backend >/dev/null 2>&1 || pm2 resurrect 2>/dev/null || true

            echo "===== FINAL STATE ====="
            $SUDO systemctl is-active nginx 2>/dev/null || echo "nginx NOT active"
            pm2 status 2>/dev/null || true
            df -h / 2>/dev/null
            (ss -lntp 2>/dev/null || netstat -lntp 2>/dev/null) | grep -E ':(80|443|5050)\b' || echo "nothing listening on 80/443/5050"
            curl -sS -o /dev/null -w "http://127.0.0.1/ -> %{http_code}\n" --max-time 10 http://127.0.0.1/ || echo "local HTTP request failed"
            curl -sS -o /dev/null -w "http://127.0.0.1:5050/api/public/website-settings -> %{http_code}\n" --max-time 10 http://127.0.0.1:5050/api/public/website-settings || echo "backend request failed"
